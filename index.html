<script>
(function(){
var el=document.getElementById('jp-splash');if(!el)return;
var t0=Date.now(),MIN=1500,done=false;
function hideNative(){try{if(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())Capacitor.registerPlugin('SplashScreen').hide({fadeOutDuration:150});}catch(e){}}
/* Le splash natif ne part qu'une fois le logo web réellement peint : plus de trou blanc. */
requestAnimationFrame(function(){requestAnimationFrame(hideNative);});
function close(){if(done)return;done=true;el.classList.add('out');document.documentElement.classList.remove('jp-boot');setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},450);}
function ready(){setTimeout(close,Math.max(0,MIN-(Date.now()-t0)));}
window.addEventListener('jp:ready',ready,{once:true});
setTimeout(close,6000);
})();
</script>

<script>
/* Chargeur de bibliothèques à la demande : copie locale d'abord (./vendor), CDN en secours. */
(function(){
var L={
 jszip:['./vendor/jszip.min.js','https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'],
 jspdf:['./vendor/jspdf.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'],
 supabase:['./vendor/supabase.js','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2']
},ok={jszip:function(){return typeof JSZip!=='undefined';},jspdf:function(){return typeof jspdf!=='undefined';},supabase:function(){return !!(window.supabase&&window.supabase.createClient);}},P={};
function tag(u){return new Promise(function(res,rej){var s=document.createElement('script');s.src=u;s.async=true;s.onload=res;s.onerror=function(){s.remove();rej(new Error(u));};document.head.appendChild(s);});}
window.JPLibs={load:function(n){
 if(ok[n]())return Promise.resolve();
 if(P[n])return P[n];
 var p=L[n].reduce(function(chain,u){return chain.catch(function(){return tag(u).then(function(){if(!ok[n]())throw new Error(n);});});},Promise.reject());
 P[n]=p.catch(function(e){delete P[n];throw {code:'lib',lib:n};});
 return P[n];}};
})();
</script>
