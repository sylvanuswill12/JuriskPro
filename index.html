<style>
/* Concept : un atelier de rédaction. Le formulaire est à gauche, la feuille de statuts à droite se remplit pendant la saisie. Le portail range les modèles par famille d'actes. */
:root{
  --font-ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-doc:'Times New Roman',Times,'Liberation Serif','Nimbus Roman',serif;
  --bg:#F1F4F2; --surface:#FFFFFF; --surface-2:#F6F8F7; --ink:#16231E; --ink-2:#4A5B54; --line:#D3DBD6;
  --accent:#0B6B4C; --accent-ink:#FFFFFF; --accent-soft:#DDF0E6; --accent-line:#9CCDB7;
  --warn:#8A5300; --warn-soft:#FDEFD0; --danger:#B3261E;
  --paper:#FFFFFF; --paper-ink:#1C1F1D; --paper-rule:#C6CDC8; --paper-head:#EEF1EF;
  --fill:#D6EEE2; --fill-ink:#094833; --blank:#FFEFC9; --blank-ink:#7A4A00;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1411; --surface:#151F1B; --surface-2:#1A2622; --ink:#E6EEE9; --ink-2:#9DB1A8; --line:#2B3A34;
    --accent:#52C99C; --accent-ink:#052117; --accent-soft:#16372B; --accent-line:#2D6B53;
    --warn:#EDB45C; --warn-soft:#3A2C10; --danger:#F28B82; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1411; --surface:#151F1B; --surface-2:#1A2622; --ink:#E6EEE9; --ink-2:#9DB1A8; --line:#2B3A34;
  --accent:#52C99C; --accent-ink:#052117; --accent-soft:#16372B; --accent-line:#2D6B53;
  --warn:#EDB45C; --warn-soft:#3A2C10; --danger:#F28B82; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font-ui);padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:1240px;margin:0 auto}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.brand .mark{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:700 18px/1 var(--font-doc)}
 .brand-logo{display:block;width:36px;height:36px;flex:0 0 36px;object-fit:cover;border-radius:9px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.brand b{color:var(--accent);font-weight:700}

/* Portail : accueil */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center;padding-block:24px 30px}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:clamp(28px,4.4vw,44px);line-height:1.08;letter-spacing:-.025em;font-weight:700;margin-top:10px;text-wrap:balance}
.hero .lead{margin-top:16px;color:var(--ink-2);font-size:16.5px;max-width:52ch}
.search{position:relative;margin-top:22px;max-width:520px}
.search input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 14px 0 44px;font-size:16px}
.search input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-2);pointer-events:none}
.demo{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:8px;padding:22px 26px;font:400 14.5px/1.65 var(--font-doc);box-shadow:0 1px 0 var(--line)}
.demo .cap{font:600 11.5px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:#5A6760;margin-bottom:14px;display:block}
.demo .art{font-weight:700;letter-spacing:.03em;font-size:13px;margin-bottom:6px}
.demo p+p{margin-top:8px}
.demo .v{background:var(--fill);color:var(--fill-ink);border-radius:3px;padding:0 2px}
.demo .b{background:var(--blank);color:var(--blank-ink);border-radius:3px;padding:0 2px;letter-spacing:.06em}
.block{padding-block:10px 18px}
.cat-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin:0 0 12px}
.cat-h h2{font-size:18px;letter-spacing:-.01em}
.cat-h span{font-size:13px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;margin-bottom:22px}
.model{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.model:hover,.model:focus-within{border-color:var(--accent)}
.mhead{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink-2)}
.mcat{font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.model h3{font-size:18px;letter-spacing:-.01em;line-height:1.25;margin-top:4px}
.model h3 a{color:var(--ink);text-decoration:none}
.model h3 a::after{content:"";position:absolute;inset:0;border-radius:var(--radius)}
.model h3 a:focus-visible{outline:none}
.model:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.msub{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.mres{color:var(--ink-2);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin-top:8px}
.tags li{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.mfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px}
.go{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap}
.pill{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn);border-radius:999px;padding:2px 9px}
.empty{padding:22px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--ink-2)}
/* Brouillons */
.drafts{display:grid;gap:10px;margin-bottom:12px}
.draft{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px}
.draft h3{font-size:15.5px}
.draft p{font-size:13px;color:var(--ink-2);margin-top:2px;overflow-wrap:anywhere}
.draft .acts{display:flex;gap:8px;flex-wrap:wrap}
/* Parcours */
.path{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px}
.path h3{font-size:16px}
.path>p{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.path ol{list-style:none;padding:0;margin:16px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.path li{border-left:3px solid var(--accent-line);padding:2px 0 2px 14px;min-width:0}
.path li strong{display:block;font-size:14.5px}
.path li span{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.path li .lk{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:13.5px;font-weight:600}
.soon{margin-top:14px;font-size:13.5px;color:var(--ink-2)}
.foot{padding-block:30px 40px;font-size:12.5px;color:var(--ink-2);max-width:78ch}

/* Atelier */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);padding-bottom:6px}
.crumbs a{color:var(--ink-2)}
.title-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding-bottom:16px}
.title-row h1{font-size:clamp(22px,3vw,28px);letter-spacing:-.02em}
.title-row p{font-size:13.5px;color:var(--ink-2)}
.pane-switch{display:none}
.work{display:grid;grid-template-columns:minmax(0,470px) minmax(0,1fr);gap:28px;align-items:start}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:2px 0 12px;margin:0}
.step{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;white-space:nowrap;cursor:pointer}
.step .n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.step.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.on .n{background:transparent;border-color:currentColor}
.step.done .n{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
/* Statut des étapes : neutre si non vérifiée, vert si complète, rouge si à corriger */
.step.step-good{border-color:#16815b;background:#e9f7ef;color:#126744}
.step.step-good .n{background:#16815b;border-color:#16815b;color:#fff}
.step.step-bad{border-color:#c62828;background:#fff0f0;color:#a61b1b}
.step.step-bad .n{background:#c62828;border-color:#c62828;color:#fff}
.step.step-good.on{box-shadow:0 0 0 2px #16815b20}
.step.step-bad.on{box-shadow:0 0 0 2px #c6282820}
@media(prefers-color-scheme:dark){.step.step-good{background:#123a2b;color:#a8e6c4}.step.step-bad{background:#421d20;color:#ffc2c2}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.card h2{font-size:20px;letter-spacing:-.015em}
.card h2:focus{outline:none}
.intro{color:var(--ink-2);font-size:13.5px;margin-top:4px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}
.field{grid-column:1/-1;min-width:0;border:0;padding:0;margin:0}
.field.half{grid-column:auto}
.field[hidden]{display:none}
.field label,.field legend{display:block;font-size:13px;font-weight:600;margin-bottom:6px;padding:0}
.required-star{color:#c62828;font-weight:800;margin-left:3px}
.field input[type=text],.field input[type=date],.field textarea,.field select{width:100%;font:400 16px/1.35 var(--font-ui);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-height:44px}
.field select{appearance:auto}
.field textarea{resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-2);opacity:.7}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.inp{position:relative}
.inp input{padding-right:78px !important}
.inp .unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12.5px;color:var(--ink-2);pointer-events:none}
.aide{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.opts{display:grid;gap:8px}
.opts.seg{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.ob{display:block;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);min-height:44px}
.ot{display:block;font-weight:600;font-size:14px}
.od{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.opt input:checked + .ob{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt input:focus-visible + .ob{outline:2px solid var(--accent);outline-offset:2px}
.info{font-size:13px;padding:9px 12px;border-radius:8px;background:var(--surface-2);border:1px dashed var(--line);color:var(--ink-2)}
.info.ok{background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--ink)}
.info.bad{background:var(--warn-soft);border:1px solid var(--warn);color:var(--ink)}
.sub-h{grid-column:1/-1;font-size:14px;margin-top:6px;padding-top:16px;border-top:1px solid var(--line)}
.sub-h[hidden]{display:none}
.rhead{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding-top:16px;border-top:1px solid var(--line)}
.rhead:first-child{margin-top:0;padding-top:0;border-top:0}
.rhead h3{font-size:15px;min-width:0;overflow-wrap:anywhere}
.rhead h3 span{font-weight:500;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.55;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.small{min-height:38px;padding:0 14px;font-size:13.5px}
.btn.danger.armed{border-color:var(--danger);color:var(--danger);font-weight:700}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.tools{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:13px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn.armed{color:var(--danger);font-weight:600}
.exnote{margin-top:12px;font-size:13px;padding:9px 12px;border-radius:8px;background:var(--warn-soft);border:1px solid var(--warn)}
.exnote.ok{background:var(--accent-soft);border-color:var(--accent-line)}
.final-h{margin-top:18px;display:grid;gap:10px}
.status-line{font-size:14px;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)}
.status-line.ok{background:var(--accent-soft);border-color:var(--accent-line)}
.status-line.warn{background:var(--warn-soft);border-color:var(--warn)}
.todo{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.todo button{width:100%;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13.5px}
.todo button:hover{border-color:var(--accent)}
.todo small{color:var(--ink-2);white-space:nowrap}
.dl-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.dl-row .btn{flex:1 1 220px}
.msg{font-size:13.5px;min-height:20px}
.msg.err{color:var(--danger)}
.note{font-size:12.5px;color:var(--ink-2)}
.next{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:8px;padding:12px 14px}
.next p{font-size:13.5px;min-width:0;flex:1 1 220px}

/* Aperçu */
.preview{position:sticky;top:max(16px,env(safe-area-inset-top,0px));max-height:calc(100dvh - 32px);display:flex;flex-direction:column;gap:10px;min-width:0}
.pv-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;font-size:13px}
.pv-head strong{font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--ink-2);font-size:12.5px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .lv{background:var(--fill);border:1px solid #9CCDB7}
.legend .lb{background:var(--blank);border:1px solid #E3B25A}
.sheet-scroll{overflow:auto;min-height:0;border-radius:8px}
.sheet{background:var(--paper);color:var(--paper-ink);font-family:var(--font-doc);font-size:16px;line-height:1.5;padding:46px 52px;border:1px solid var(--line);border-radius:8px;hyphens:auto;overflow-wrap:anywhere}
.sheet p{margin:0 0 .7em;text-align:justify}
.sheet .tit,.sheet .tit2,.sheet .part,.sheet .art{hyphens:manual}
.sheet .tit{text-align:center;font-weight:700;margin:0 0 .15em;letter-spacing:.02em}
.sheet .tit2{text-align:center;font-size:12.5px;margin:.2em 0 .8em;color:#4A5450}
.sheet .part{text-align:center;font-weight:700;margin:1.9em 0 .8em;letter-spacing:.06em}
.sheet .art{font-weight:700;margin:1.5em 0 .45em;font-size:14px;letter-spacing:.04em;text-align:left}
.sheet .sub{font-weight:700;font-style:italic;text-align:left}
.sheet .li{padding-left:1.5em;text-indent:-1em}
.sheet .li::before{content:"– ";}
.sheet .right{text-align:right}
.sheet .center{text-align:center}
.sheet .sp{height:.9em}
.sheet .tw{overflow-x:auto;margin:.4em 0 1.1em}
.sheet table{width:100%;border-collapse:collapse;font-size:15px;table-layout:fixed}
.sheet .tw table.wide{min-width:540px;font-size:13px}
.sheet table.box{margin:.4em 0 1.1em}
.sheet td,.sheet th{color:var(--paper-ink);border:1px solid var(--paper-rule);padding:8px 10px;vertical-align:top;text-align:left;overflow-wrap:anywhere}
.sheet td.right{text-align:right}
.sheet td.center{text-align:center}
.sheet th{background:var(--paper-head);text-align:center;font-size:12.5px;letter-spacing:.04em}
.sheet td div+div{margin-top:2px}
.sheet td div:empty{height:.6em}
.sheet .sigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px;margin:.6em 0 1em}
.sheet .sg>div:first-child{text-align:left}
.sheet .sline{height:54px;border-bottom:1px dotted var(--paper-rule)}
.v{background:var(--fill);color:var(--fill-ink);border-radius:3px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.g{border-radius:3px}
.b{background:var(--blank);color:var(--blank-ink);border-radius:3px;padding:0 2px;letter-spacing:.06em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.flash{animation:flash 1.5s ease-out}
@keyframes flash{0%,55%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;box-shadow:0 0 0 3px var(--accent)}}

.preview[hidden], .pane-switch button[hidden]{display:none!important}
@media (max-width:979px){
  .pane-switch:has(button[hidden]){grid-template-columns:1fr}
  .hero{grid-template-columns:minmax(0,1fr);gap:24px}
  .work{grid-template-columns:minmax(0,1fr)}
  .pane-switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:6px 0 10px;margin-bottom:4px}
  .pane-switch button{min-height:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}

  .pane-switch .bdg[hidden]{display:none}

  #wiz[data-pane=form] .preview{display:none}

  .preview{position:static;max-height:none}
  .sheet-scroll{overflow:visible}
}

  .sheet{padding:26px 20px;font-size:14.5px}
  .card{padding:18px}
  .draft{grid-template-columns:minmax(0,1fr)}
  .sheet .sigs{grid-template-columns:minmax(0,1fr)}
}

</head><body>
<div id="app"></div>
<noscript>JuriskPro a besoin de JavaScript pour fonctionner.</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ============================================================
   CŒUR : nombres en lettres, rendu des blocs, export Word et PDF.
   Les modèles (m1, m2, m3) fournissent leurs questions et leur texte.
   Un bloc de texte peut contenir {{champs}} et **gras**.
   ============================================================ */
const NB=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'];
const DIZ=['','','vingt','trente','quarante','cinquante','soixante'];
function sous100(n,fin){
  if(n<17) return NB[n];
  if(n<20) return 'dix-'+NB[n-10];
  if(n<70){const d=Math.floor(n/10),u=n%10;return DIZ[d]+(u===0?'':(u===1?' et un':'-'+NB[u]));}
  if(n<80){const u=n-60;return 'soixante'+(u===11?' et onze':'-'+sous100(u,false));}
  const u=n-80;
  if(u===0) return fin?'quatre-vingts':'quatre-vingt';
  return 'quatre-vingt-'+sous100(u,false);
}
function sous1000(n,fin){
  const c=Math.floor(n/100),r=n%100;let s='';
  if(c>0){
    s=c===1?'cent':NB[c]+' cent';
    if(r===0&&c>1&&fin) s+='s';
    if(r>0) s+=' ';
  }
  if(r>0) s+=sous100(r,fin);
  return s;
}
function lettres(n){
  n=Math.floor(Number(n)||0);
  if(n===0) return 'zéro';
  if(n>=1e12) return String(n);
  const p=[];
  const mrd=Math.floor(n/1e9),mil=Math.floor(n%1e9/1e6),k=Math.floor(n%1e6/1e3),r=n%1e3;
  if(mrd) p.push(sous1000(mrd,true)+' milliard'+(mrd>1?'s':''));
  if(mil) p.push(sous1000(mil,true)+' million'+(mil>1?'s':''));
  if(k) p.push(k===1?'mille':sous1000(k,false)+' mille');
  if(r) p.push(sous1000(r,true));
  return p.join(' ');
}
function fcfa(n){
  const s=lettres(n);
  if(n===1) return 'un franc CFA';
  return /(million|milliard)s?$/.test(s)?s+' de francs CFA':s+' francs CFA';
}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function dateFr(iso){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');
  if(!m) return '';
  const d=+m[3],mo=+m[2]-1;
  if(mo<0||mo>11||d<1||d>31) return '';
  return (d===1?'1er':d)+' '+MOIS[mo]+' '+m[1];
}
function anneeLettres(iso){const m=/^(\d{4})-/.exec(iso||'');return m?lettres(+m[1]):'';}
function todayISO(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const CIV=[{v:'M.',t:'Monsieur'},{v:'Mme',t:'Madame'}];

/* ---------- Valeurs communes à tous les modèles ---------- */
function newV(){return {_src:{},_nohl:new Set()};}
/* Une personne (associé, gérant, mandataire) : prefixe p, indice i, champs p+i+'_civilite', '_prenom', '_nom'… */
function addPerson(V,S,p,i){
  const id=p+i+'_',g=k=>String(S[id+k]==null?'':S[id+k]).trim();
  const fem=g('civilite')==='Mme';
  const gram=(k,val)=>{V[id+k]=val;V._src[id+k]=id+'civilite';V._nohl.add(id+k);};
  gram('civ',fem?'Mme':'M.');gram('civ_long',fem?'Madame':'Monsieur');
  gram('ne',fem?'née':'né');gram('Ne',fem?'Née':'Né');gram('il',fem?'elle':'il');
  ['prenom','naissance_lieu','nationalite','profession','adresse','piece'].forEach(k=>{V[id+k]=g(k);});
  V[id+'nom']=g('nom').toUpperCase();
  V[id+'naissance']=dateFr(g('naissance_date'));V._src[id+'naissance']=id+'naissance_date';
  V[id+'ident']=[V[id+'civ'],V[id+'prenom'],V[id+'nom']].filter(Boolean).join(' ');
}
const ASSO=(i,p)=>'{{'+(p||'a')+i+'_civ}} {{'+(p||'a')+i+'_prenom}} {{'+(p||'a')+i+'_nom}}';
function personName(S,p,i){
  const n=((S[p+i+'_prenom']||'')+' '+String(S[p+i+'_nom']||'').toUpperCase()).trim();
  return n||('Associé '+(i+1));
}
function loadDraftS(id){
  try{const o=JSON.parse(localStorage.getItem('juriskpro:'+id+':v1')||'null');return o&&o.v?o.v:null;}catch(e){return null;}
}
function fileSlug(s){
  return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}

/* ---------- Découpage d'un texte en segments ---------- */
function runs(text,V){
  const src=(V&&V._src)||{},nh=(V&&V._nohl)||null,out=[];let bold=false;
  String(text).split(/(\*\*|\{\{\??\w+\}\})/).forEach(tok=>{
    if(!tok) return;
    if(tok==='**'){bold=!bold;return;}
    const m=/^\{\{(\??)(\w+)\}\}$/.exec(tok);
    if(m){
      const key=m[2],val=V[key]==null?'':String(V[key]),f=src[key]||key;
      if(val===''){if(m[1]) return;out.push({t:'',b:bold,f:f,key:key,miss:true});}
      else out.push({t:val,b:bold,f:f,key:key,g:!!(nh&&nh.has(key))});
    }else out.push({t:tok,b:bold});
  });
  return out;
}
function runHTML(r,miss){
  if(r.miss){miss.add(r.f);return '<span class="b" data-f="'+r.f+'" title="À compléter">………………</span>';}
  const t=esc(r.t),inner=r.b?'<strong>'+t+'</strong>':t;
  return r.f?'<span class="'+(r.g?'g':'v')+'" data-f="'+r.f+'">'+inner+'</span>':inner;
}
const lineHTML=(text,V,miss)=>runs(text,V).map(r=>runHTML(r,miss)).join('');
const cellLines=c=>Array.isArray(c)?c:[c];
const cellHTML=(c,V,miss)=>cellLines(c).map(l=>'<div>'+lineHTML(l,V,miss)+'</div>').join('');
const ALCLS={right:' class="right"',center:' class="center"',left:''};
function renderHTML(blocks,V){
  const miss=new Set();
  const h=blocks.map(b=>{
    switch(b.k){
      case 'tit':return '<p class="tit">'+lineHTML(b.text,V,miss)+'</p>';
      case 'sous':return '<p class="tit2">'+lineHTML(b.text,V,miss)+'</p>';
      case 'part':return '<p class="part">'+lineHTML(b.text,V,miss)+'</p>';
      case 'art':return '<p class="art">'+lineHTML(b.text,V,miss)+'</p>';
      case 'sub':return '<p class="sub">'+lineHTML(b.text,V,miss)+'</p>';
      case 'li':return '<p class="li">'+lineHTML(b.text,V,miss)+'</p>';
      case 'sp':return '<div class="sp"></div>';
      case 'pb':return '<hr class="pb">';
      case 'p':return '<p'+(ALCLS[b.al]||'')+'>'+lineHTML(b.text,V,miss)+'</p>';
      case 'box':return '<table class="box"><tbody><tr><td>'+b.lines.map(l=>'<div>'+lineHTML(l,V,miss)+'</div>').join('')+'</td></tr></tbody></table>';
      case 'sigs':return '<div class="sigs">'+b.items.map(t=>'<div class="sg"><div>'+lineHTML(t,V,miss)+'</div><div class="sline"></div></div>').join('')+'</div>';
      case 'table':{
        const al=b.al||[];
        const cg='<colgroup>'+b.cols.map(w=>'<col style="width:'+w+'%">').join('')+'</colgroup>';
        const th='<thead><tr>'+b.head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead>';
        const tb='<tbody>'+b.rows.map(r=>'<tr>'+r.map((c,i)=>'<td'+(al[i]&&al[i]!=='left'?' class="'+al[i]+'"':'')+'>'+cellHTML(c,V,miss)+'</td>').join('')+'</tr>').join('')+'</tbody>';
        return '<div class="tw"><table'+(b.cols.length>3?' class="wide"':'')+'>'+cg+th+tb+'</table></div>';
      }
    }
    return '';
  }).join('');
  return {html:h,missing:miss};
}
function toText(blocks,V){
  const plain=t=>runs(t,V).map(r=>r.miss?'…………':r.t).join('');
  const cell=c=>cellLines(c).map(plain).join(' / ');
  return blocks.map(b=>{
    if(b.k==='sp') return '';
    if(b.k==='pb') return '\f';
    if(b.k==='box') return b.lines.map(plain).join('\n');
    if(b.k==='sigs') return b.items.map(plain).join('\n');
    if(b.k==='table') return b.head.join(' | ')+'\n'+b.rows.map(r=>r.map(cell).join(' | ')).join('\n');
    if(b.k==='li') return '– '+plain(b.text);
    return plain(b.text);
  }).join('\n');
}

/* ---------- Export Word (.docx) ---------- */
const xe=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
function runsXML(text,V,o){
  o=o||{};
  return runs(text,V).map(r=>{
    const t=r.miss?'………………':r.t;
    const pr=((r.b||o.bold)?'<w:b/>':'')+(o.italic?'<w:i/>':'')+(o.size?'<w:sz w:val="'+o.size+'"/><w:szCs w:val="'+o.size+'"/>':'');
    return '<w:r>'+(pr?'<w:rPr>'+pr+'</w:rPr>':'')+'<w:t xml:space="preserve">'+xe(t)+'</w:t></w:r>';
  }).join('');
}
function paraXML(inner,o){
  o=o||{};
  const pp=(o.keep?'<w:keepNext/>':'')+'<w:spacing w:before="'+(o.before||0)+'" w:after="'+(o.after==null?120:o.after)+'" w:line="'+(o.line||276)+'" w:lineRule="auto"/>'+(o.ind||'')+'<w:jc w:val="'+(o.jc||'both')+'"/>';
  return '<w:p><w:pPr>'+pp+'</w:pPr>'+inner+'</w:p>';
}
const JC={left:'left',right:'right',center:'center'};
function tblXML(o,V){
  const total=9070,cols=o.cols.map(w=>Math.round(total*w/100));
  const bd=o.borders===false?'<w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/><w:insideH w:val="nil"/><w:insideV w:val="nil"/>':
    '<w:top w:val="single" w:sz="4" w:space="0" w:color="808080"/><w:left w:val="single" w:sz="4" w:space="0" w:color="808080"/><w:bottom w:val="single" w:sz="4" w:space="0" w:color="808080"/><w:right w:val="single" w:sz="4" w:space="0" w:color="808080"/><w:insideH w:val="single" w:sz="4" w:space="0" w:color="808080"/><w:insideV w:val="single" w:sz="4" w:space="0" w:color="808080"/>';
  const pr='<w:tblPr><w:tblW w:w="'+total+'" w:type="dxa"/><w:tblBorders>'+bd+'</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="80" w:type="dxa"/><w:left w:w="120" w:type="dxa"/><w:bottom w:w="80" w:type="dxa"/><w:right w:w="120" w:type="dxa"/></w:tblCellMar></w:tblPr>';
  const grid='<w:tblGrid>'+cols.map(w=>'<w:gridCol w:w="'+w+'"/>').join('')+'</w:tblGrid>';
  const cell=(w,lines,c)=>'<w:tc><w:tcPr><w:tcW w:w="'+w+'" w:type="dxa"/>'+(c.shade?'<w:shd w:val="clear" w:color="auto" w:fill="E9EDEA"/>':'')+'</w:tcPr>'+
    lines.map(l=>paraXML(c.plain?xe(l):runsXML(l,V,{bold:c.bold,size:c.size}),{jc:c.jc||'left',after:40,keep:o.keep})).join('')+'</w:tc>';
  let rows='';
  if(o.head) rows+='<w:tr><w:trPr><w:cantSplit/><w:tblHeader/></w:trPr>'+o.head.map((h,i)=>{
    return '<w:tc><w:tcPr><w:tcW w:w="'+cols[i]+'" w:type="dxa"/><w:shd w:val="clear" w:color="auto" w:fill="E9EDEA"/></w:tcPr>'+paraXML('<w:r><w:rPr><w:b/><w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr><w:t xml:space="preserve">'+xe(h)+'</w:t></w:r>',{jc:'center',after:40})+'</w:tc>';
  }).join('')+'</w:tr>';
  rows+=o.rows.map(r=>'<w:tr><w:trPr><w:cantSplit/></w:trPr>'+r.map((c,i)=>cell(cols[i],cellLines(c),{jc:JC[(o.al||[])[i]]})).join('')+'</w:tr>').join('');
  return '<w:tbl>'+pr+grid+rows+'</w:tbl>';
}
function sigRows(items){
  const rows=[];
  for(let i=0;i<items.length;i+=2) rows.push([[items[i],'','',''],items[i+1]?[items[i+1],'','','']:['','','','']]);
  return rows;
}
function blockXML(b,V){
  switch(b.k){
    case 'tit':return paraXML(runsXML(b.text,V,{bold:true,size:28}),{jc:'center',after:80,keep:true});
    case 'sous':return paraXML(runsXML(b.text,V,{size:20}),{jc:'center',after:160});
    case 'part':return paraXML(runsXML(b.text,V,{bold:true}),{jc:'center',before:360,after:160,keep:true});
    case 'art':return paraXML(runsXML(b.text,V,{bold:true}),{jc:'left',before:240,after:80,keep:true});
    case 'sub':return paraXML(runsXML(b.text,V,{bold:true,italic:true}),{jc:'left',after:80,keep:true});
    case 'li':return paraXML('<w:r><w:t>–</w:t></w:r><w:r><w:tab/></w:r>'+runsXML(b.text,V),{ind:'<w:ind w:left="567" w:hanging="284"/>',after:80,keep:b.kn});
    case 'sp':return paraXML('',{after:120,keep:b.kn});
    case 'pb':return '<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
    case 'p':return paraXML(runsXML(b.text,V),{jc:JC[b.al]||'both',keep:b.kn});
    case 'box':return tblXML({cols:[100],rows:[[b.lines]]},V)+paraXML('',{after:120});
    case 'sigs':return tblXML({cols:[50,50],rows:sigRows(b.items),borders:false,keep:true},V)+paraXML('',{after:120});
    case 'table':return tblXML(b,V)+paraXML('',{after:120});
  }
  return '';
}
async function buildDocx(blocks,V,title){
  const NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const body=blocks.map(b=>blockXML(b,V)).join('');
  const sect='<w:sectPr><w:footerReference w:type="default" r:id="rId2"/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1418" w:right="1418" w:bottom="1418" w:left="1418" w:header="709" w:footer="709" w:gutter="0"/></w:sectPr>';
  const doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document '+NS+'><w:body>'+body+sect+'</w:body></w:document>';
  const styles='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:eastAsia="Times New Roman" w:cs="Times New Roman"/><w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="fr-FR" w:eastAsia="fr-FR" w:bidi="ar-SA"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="120" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>';
  const small='<w:rPr><w:sz w:val="18"/><w:szCs w:val="18"/></w:rPr>';
  const footer='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr '+NS+'><w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r>'+small+'<w:t xml:space="preserve">Page </w:t></w:r><w:fldSimple w:instr=" PAGE "><w:r>'+small+'<w:t>1</w:t></w:r></w:fldSimple><w:r>'+small+'<w:t xml:space="preserve"> sur </w:t></w:r><w:fldSimple w:instr=" NUMPAGES "><w:r>'+small+'<w:t>1</w:t></w:r></w:fldSimple></w:p></w:ftr>';
  const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>';
  const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>';
  const drels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/></Relationships>';
  const core='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>'+xe(title)+'</dc:title><dc:creator>JuriskPro</dc:creator></cp:coreProperties>';
  const zip=new JSZip();
  zip.file('[Content_Types].xml',ct);
  zip.file('_rels/.rels',rels);
  zip.file('docProps/core.xml',core);
  zip.file('word/document.xml',doc);
  zip.file('word/styles.xml',styles);
  zip.file('word/footer1.xml',footer);

/* ---------- Export PDF (jsPDF) ---------- */
async function buildPdf(blocks,V,title){
  const J=(typeof jspdf!=='undefined'&&jspdf.jsPDF)?jspdf.jsPDF:null;
  if(!J) throw {code:'lib'};
  const doc=new J({unit:'mm',format:'a4',compress:true});
  const PW=210,PH=297,M=25,TW=PW-2*M,FS=12,PT=0.3528;
  let y=M,dry=false;
  const setF=(b,i)=>doc.setFont('times',b&&i?'bolditalic':b?'bold':i?'italic':'normal');
  const segsOf=(text,bold,italic)=>runs(text,V).map(r=>({t:r.miss?'………………':r.t,b:!!(r.b||bold),i:!!italic}));
  function atomsOf(segs){
    const out=[];let sp=false;
    segs.forEach(s=>{
      String(s.t).split(' ').forEach((p,i)=>{
        if(i>0) sp=true;
        if(p==='') return;
        out.push({t:p,b:s.b,i:s.i,sp:sp&&out.length>0});
        sp=false;
      });
    });
    return out;
  }
  function layout(segs,w,size){
    doc.setFontSize(size);
    const at=atomsOf(segs);
    at.forEach(a=>{setF(a.b,a.i);a.w=doc.getTextWidth(a.t);});
    setF(false,false);
    const spw=doc.getTextWidth(' ');
    const lines=[];let cur=[],cw=0;
    at.forEach(a=>{
      const need=cur.length?(a.sp?spw:0)+a.w:a.w;
      if(cur.length&&cw+need>w){lines.push(cur);cur=[a];cw=a.w;}else{cur.push(a);cw+=need;}
    });
    if(cur.length) lines.push(cur);
    if(!lines.length) lines.push([]);
    return {lines:lines,spw:spw,size:size,lh:size*PT*1.3};
  }
  function paint(L,i,x,top,w,align){
    if(dry) return;
    const ln=L.lines[i],last=i===L.lines.length-1;
    doc.setFontSize(L.size);
    let natural=0,gaps=0;
    ln.forEach((a,k)=>{natural+=a.w;if(k&&a.sp){natural+=L.spw;gaps++;}});
    let extra=0;
    if(align==='both'&&!last&&gaps>0) extra=Math.max(0,(w-natural)/gaps);
    let cx=x;
    if(align==='right') cx=x+w-natural; else if(align==='center') cx=x+(w-natural)/2;
    const base=top+L.size*PT*1.02;
    ln.forEach((a,k)=>{if(k&&a.sp) cx+=L.spw+extra;setF(a.b,a.i);doc.text(a.t,cx,base);cx+=a.w;});
  }
  const ensure=h=>{if(dry) return;if(y+h>PH-M){doc.addPage();y=M;}};
  function para(text,o){
    o=o||{};
    const x=M+(o.indent||0),w=TW-(o.indent||0);
    const L=layout(segsOf(text,o.bold,o.italic),w,o.size||FS);
    y+=o.before||0;
    ensure(L.lh*Math.min(L.lines.length,o.keep?3:2));
    if(o.bullet&&!dry){doc.setFontSize(L.size);setF(false,false);doc.text('–',M+3,y+L.size*PT*1.02);}
    for(let i=0;i<L.lines.length;i++){ensure(L.lh);paint(L,i,x,y,w,o.align||'both');y+=L.lh;}
    y+=o.after==null?2.2:o.after;
  }
  function row(cells,widths,o){
    const pad=2,gap=0.8;
    const Ls=cells.map((paras,ci)=>cellLines(paras).map(t=>layout(segsOf(t,o.bold,false),widths[ci]-2*pad,o.size||10.5)));
    const hs=Ls.map(ps=>ps.reduce((s,L)=>s+L.lines.length*L.lh+gap,0)+2*pad-gap);
    const h=Math.max.apply(null,hs);
    ensure(h);
    let cx=M;
    cells.forEach((_,ci)=>{
      if(o.border!==false&&!dry){
        if(o.shade){doc.setFillColor(233,237,234);doc.rect(cx,y,widths[ci],h,'FD');}else doc.rect(cx,y,widths[ci],h);
      }
      let ty=y+pad;
      const al=(o.aligns&&o.aligns[ci])||o.align||'left';
      Ls[ci].forEach(L=>{for(let i=0;i<L.lines.length;i++){paint(L,i,cx+pad,ty,widths[ci]-2*pad,al);ty+=L.lh;}ty+=gap;});
      cx+=widths[ci];
    });
    y+=h;
  }
  doc.setDrawColor(110);doc.setLineWidth(0.2);doc.setTextColor(0);
  doc.setProperties({title:title,creator:'JuriskPro'});
  function draw(b){
    switch(b.k){
      case 'tit':para(b.text,{bold:true,size:13,align:'center',after:1.5});break;
      case 'sous':para(b.text,{size:9.5,align:'center',after:4});break;
      case 'part':para(b.text,{bold:true,align:'center',before:7,after:3,keep:true});break;
      case 'art':para(b.text,{bold:true,align:'left',before:4.5,after:1.5,keep:true});break;
      case 'sub':para(b.text,{bold:true,italic:true,align:'left',after:1.5,keep:true});break;
      case 'li':para(b.text,{indent:9,bullet:true,after:1.5});break;
      case 'sp':y+=3.5;break;
      case 'pb':if(!dry&&y>M+1){doc.addPage();y=M;}break;
      case 'p':para(b.text,{align:b.al||'both'});break;
      case 'box':row([b.lines],[TW],{});y+=4;break;
      case 'sigs':{
        const half=TW/2;
        for(let i=0;i<b.items.length;i+=2){
          row([[b.items[i],'','',''],b.items[i+1]?[b.items[i+1],'','','']:['','','','']],[half,half],{border:false});
        }
        y+=4;break;
      }
      case 'table':{
        const widths=b.cols.map(c=>TW*c/100);
        ensure(38);
        row(b.head.map(h=>[h]),widths,{bold:true,shade:true,align:'center',size:10});
        b.rows.forEach(r=>row(r,widths,{aligns:b.al,size:b.size}));
        y+=4;break;
      }
    }
  }
  /* Les blocs marqués kn restent sur la même page que le bloc qui les suit (signatures, « Fait à… »). */
  for(let i=0;i<blocks.length;i++){
    if(blocks[i].kn){
      let j=i;while(j<blocks.length-1&&blocks[j].kn) j++;
      const y0=y;dry=true;
      for(let k=i;k<=j;k++) draw(blocks[k]);
      dry=false;
      const h=y-y0;y=y0;
      if(h<PH-2*M&&y+h>PH-M){doc.addPage();y=M;}
      for(let k=i;k<=j;k++) draw(blocks[k]);
      i=j;
    }else draw(blocks[i]);
  }
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i);setF(false,false);doc.setFontSize(9);
    const s='Page '+i+' sur '+n;
    doc.text(s,PW/2-doc.getTextWidth(s)/2,PH-12);
  }
  return doc.output('blob');
}

/* ============================================================
   MODÈLE 2 : Statuts de SARL pluripersonnelle (apports mixtes)
   Plusieurs associés, apports en numéraire, en nature et, en option, en industrie.
   ============================================================ */
function m2Totals(S){
  const g=k=>String(S[k]==null?'':S[k]).trim();
  const n=clamp(parseInt(g('nb_assoc'),10)||2,2,8);
  const nom=+g('nominal')||0,num=[],nat=[];let numTot=0,natTot=0,indParts=0;
  for(let i=0;i<n;i++){
    const a=+g('a'+i+'_num')||0,b=+g('a'+i+'_nat_val')||0;
    num.push(a);nat.push(b);numTot+=a;natTot+=b;
    if(g('industrie')==='oui') indParts+=(+g('a'+i+'_ind_parts')||0);
  }
  const cap=numTot+natTot;
  const ok=nom>0&&cap>0&&cap%nom===0&&num.every(x=>x%nom===0)&&nat.every(x=>x%nom===0);
  return {n:n,nom:nom,num:num,nat:nat,numTot:numTot,natTot:natTot,cap:cap,ok:ok,parts:ok?cap/nom:0,indParts:indParts};
}
function m2SrcOptions(S){
  const n=m2Totals(S).n,o=[];
  for(let i=0;i<n;i++) o.push({v:'a'+i,t:'Associé '+(i+1)+' : '+personName(S,'a',i).replace(/^Associé \d+$/,'à renseigner')});
  o.push({v:'autre',t:'Une autre personne'});
  return o;
}

function m2Compute(S){
  const V=newV(),g=k=>String(S[k]==null?'':S[k]).trim(),gn=k=>g(k).replace(/\s*\n+\s*/g,' ');
  const T=m2Totals(S),n=T.n,pr=(k,val,src)=>{V[k]=val;if(src)V._src[k]=src;};
  const ind=g('industrie')==='oui';
  for(let i=0;i<n;i++) addPerson(V,S,'a',i);
  ['denomination','sigle','objet','siege','banque','lieu','commissaire','ord_ville','ord_requerant','eng_mandataire','eng_texte','limitations','maj_autre'].forEach(k=>{V[k]=gn(k);});
  V.denomination_maj=g('denomination').toUpperCase();V._src.denomination_maj='denomination';
  V.sigle_txt=g('sigle')?', en abrégé « '+g('sigle')+' »':'';V._src.sigle_txt='sigle';
  V.annee_lettres=anneeLettres(g('date'));V._src.annee_lettres='date';
  V.date_longue=dateFr(g('date'));V._src.date_longue='date';
  V.ord_date_longue=dateFr(g('ord_date'));V._src.ord_date_longue='ord_date';
  /* apports */
  const numIdx=[],natIdx=[],indIdx=[];
  for(let i=0;i<n;i++){
    const p='a'+i+'_';
    if(T.num[i]>0) numIdx.push(i);
    if(g(p+'nat_desc')||T.nat[i]>0) natIdx.push(i);
    if(ind&&(g(p+'ind_desc')||g(p+'ind_parts'))) indIdx.push(i);
    pr(p+'num_chiffres',T.num[i]?fmt(T.num[i]):'',p+'num');
    pr(p+'nat_val_chiffres',T.nat[i]?fmt(T.nat[i]):'',p+'nat_val');
    V[p+'nat_desc']=gn('a'+i+'_nat_desc');
    V[p+'ind_duree']=gn('a'+i+'_ind_duree');
    V[p+'ind_parts']=g(p+'ind_parts');
    const lines=g(p+'ind_desc').split(/\n+/).map(s=>s.trim()).filter(Boolean);
    if(!lines.length) lines.push('');
    V._indLines=V._indLines||{};V._indLines[i]=lines.length;
    lines.forEach((s,k)=>pr(p+'ind_l'+k,s,p+'ind_desc'));
  }
  const numAll=numIdx.length?numIdx:Array.from({length:n},(_,i)=>i);
  const natAll=natIdx.length?natIdx:[n-1];
  const indAll=indIdx.length?indIdx:[n-1];
  V._numIdx=numAll;V._natIdx=natAll;V._indIdx=indAll;
  /* numérotation des parts : numéraire d'abord, puis nature */
  let cur=1;
  for(let i=0;i<n;i++){
    const p='a'+i+'_',has=T.ok&&T.num[i]>0,k=has?T.num[i]/T.nom:0,s=has?'nominal':p+'num';
    pr(p+'np',has?fmt(k):'',s);pr(p+'nd',has?String(cur):'',s);pr(p+'nf',has?String(cur+k-1):'',s);
    if(has) cur+=k;
  }
  for(let i=0;i<n;i++){
    const p='a'+i+'_',has=T.ok&&T.nat[i]>0,k=has?T.nat[i]/T.nom:0,s=has?'nominal':p+'nat_val';
    pr(p+'vp',has?fmt(k):'',s);pr(p+'vd',has?String(cur):'',s);pr(p+'vf',has?String(cur+k-1):'',s);
    if(has) cur+=k;
  }
  const f0=numAll[0],f1=natAll[0];
  pr('num_tot',T.numTot?fmt(T.numTot):'','a'+f0+'_num');
  pr('num_tot_lettres',T.numTot?fcfa(T.numTot):'','a'+f0+'_num');
  pr('nat_tot',T.natTot?fmt(T.natTot):'','a'+f1+'_nat_val');
  pr('cap_chiffres',T.cap?fmt(T.cap):'','a'+f0+'_num');
  pr('cap_lettres',T.cap?fcfa(T.cap):'','a'+f0+'_num');
  pr('tot_chiffres',T.cap?fmt(T.cap):'','a'+f0+'_num');
  pr('nominal_chiffres',T.nom?fmt(T.nom):'','nominal');
  pr('parts',T.ok?fmt(T.parts):'','nominal');
  const moitie=g('liberation')==='moitie';
  V.liberation_txt=moitie?'de la moitié au moins':'intégralement';V._src.liberation_txt='liberation';V._nohl.add('liberation_txt');
  V.liberation_txt8=moitie?'de moitié au moins pour les apports en numéraire et intégralement pour les apports en nature':'intégralement';V._src.liberation_txt8='liberation';V._nohl.add('liberation_txt8');
  /* gérance */
  const dg=+g('duree_gerant')||0,pv=+g('preavis_gerant')||0;
  pr('duree_gerant_txt',dg?lettres(dg)+' '+(dg>1?'ans':'an'):'','duree_gerant');
  pr('preavis_txt',pv?lettres(pv)+' ('+pv+') mois':'','preavis_gerant');
  pr('maj_txt',g('maj_nom')==='autre'?gn('maj_autre'):'de plus de la moitié des parts',g('maj_nom')==='autre'?'maj_autre':'maj_nom');
  const ng=g('gerance_mode')==='ulterieur'?0:clamp(parseInt(g('nb_ger'),10)||1,1,3);
  V._ng=ng;
  for(let j=0;j<ng;j++){
    const src=g('g'+j+'_src'),k=/^a(\d+)$/.exec(src);
    if(k&&+k[1]<n){
      const a='a'+k[1]+'_',id='g'+j+'_';
      ['civ'].forEach(x=>{V[id+x]=V[a+x];V._src[id+x]=a+'civilite';V._nohl.add(id+x);});
      ['prenom','nom','adresse'].forEach(x=>{V[id+x]=V[a+x];V._src[id+x]=a+x;});
    }else addPerson(V,S,'g',j);
  }
  /* mandataire des formalités */
  const mk=/^a(\d+)$/.exec(g('m_src'));
  if(mk&&+mk[1]<n){
    const a='a'+mk[1]+'_';
    V.m_civ_long=V[a+'civ_long'];V._src.m_civ_long=a+'civilite';V._nohl.add('m_civ_long');
    V.m_nom_complet=(V[a+'prenom']+' '+V[a+'nom']).trim();V._src.m_nom_complet=a+'nom';
    V.m_prof=V[a+'profession'];V._src.m_prof=a+'profession';
    V.m_pc=V[a+'piece'];V._src.m_pc=a+'piece';
  }else{
    V.m_civ_long=g('m_civilite')==='Mme'?'Madame':'Monsieur';V._src.m_civ_long='m_civilite';V._nohl.add('m_civ_long');
    V.m_nom_complet=gn('m_nom');V._src.m_nom_complet='m_nom';
    V.m_prof=gn('m_profession');V._src.m_prof='m_profession';
    V.m_pc=gn('m_piece');V._src.m_pc='m_piece';
  }
  const nbx=+g('nb_ex')||(n+2);
  pr('nb_ex_txt',String(nbx),'nb_ex');pr('nb_ex_lettres_maj',lettres(nbx).toUpperCase(),'nb_ex');
  return V;
}

function m2Blocks(S,V){
  const T=m2Totals(S),n=T.n,B=[],ap=(...x)=>{x.forEach(y=>B.push(y));};
  const ind=String(S.industrie)==='oui',moitie=S.liberation==='moitie';
  const R=['I','II','III','IV','V'];let rn=0;
  ap({k:'tit',text:'STATUTS DE LA SOCIÉTÉ À RESPONSABILITÉ LIMITÉE DÉNOMMÉE'},{k:'tit',text:'« {{denomination_maj}} SARL »'},{k:'sp'},
     P('L’an {{annee_lettres}},'),P('Le {{date_longue}},'),P('**Entre les soussignés,**'));
  const lines=[];
  for(let i=0;i<n;i++){
    lines.push('**'+ASSO(i)+'**, {{a'+i+'_ne}} le {{a'+i+'_naissance}} à {{a'+i+'_naissance_lieu}}, de nationalité {{a'+i+'_nationalite}}, {{a'+i+'_profession}}');
    lines.push('Demeurant à {{a'+i+'_adresse}}. Pièce d’identité : {{a'+i+'_piece}}');
    if(i<n-1) lines.push('');
  }
  ap({k:'box',lines:lines},P('Il a été établi par les présentes, les statuts de la Société à Responsabilité Limitée dont la teneur suit :'));
  ap({k:'part',text:'TITRE I : DISPOSITIONS GÉNÉRALES'},
   ART(1,'FORME'),
   P('Il est constitué par les soussignés, une Société à Responsabilité Limitée devant exister entre eux et tous propriétaires de parts sociales ultérieures, qui sera régie par l’Acte Uniforme révisé de l’OHADA du 30 janvier 2014 relatif au droit des Sociétés commerciales et du Groupement d’intérêt économique (GIE), ainsi que par toutes autres dispositions légales ou réglementaires applicables et les présents statuts.'),
   ART(2,'DÉNOMINATION'),
   P('La société a pour dénomination : **{{denomination}}**{{?sigle_txt}}'),
   P('La dénomination sociale doit figurer sur tous les actes et documents émanant de la société et destinés aux tiers, notamment les lettres, les factures, les annonces et publications diverses. Elle doit être précédée ou suivie immédiatement en caractères lisibles de l’indication Société à Responsabilité Limitée ou SARL, du montant de son capital social, de l’adresse de son siège social et de la mention de son immatriculation au Registre du Commerce et du Crédit Mobilier.'),
   ART(3,'OBJET'),
   P('La société a pour objet en CÔTE D’IVOIRE :'),
   P('{{objet}}'),
   P('Et pour la réalisation de l’objet social :'),
   L('l’acquisition, la location et la vente de tous biens meubles et immeubles ;'),
   L('l’emprunt de toutes sommes auprès de tous établissements financiers avec possibilité de donner en garantie tout ou partie des biens sociaux ;'),
   L('la prise en location gérance de tous fonds de commerce ;'),
   L('la prise de participation dans toute société existante ou devant être créée ;'),
   L('et généralement, toutes opérations financières, commerciales, industrielles, mobilières et immobilières, se rapportant directement ou indirectement à l’objet social ou pouvant en faciliter l’extension ou le développement.'),
   ART(4,'SIÈGE SOCIAL'),
   P('Le siège social est fixé à : {{siege}}'),
   P('Il peut être transféré dans les limites du territoire de la République de CÔTE D’IVOIRE par décision de la gérance qui modifie en conséquence les statuts, sous réserve de la ratification de cette décision par la plus prochaine Assemblée Générale Ordinaire.'),
   ART(5,'DURÉE'),
   P('La durée de la société est de quatre-vingt-dix-neuf (99) années, sauf dissolution anticipée ou prorogation.'),
   ART(6,'EXERCICE SOCIAL'),
   P('L’exercice social commence le premier janvier et se termine le trente et un décembre de chaque année.'),
   P('Par exception, le premier exercice sera clos le trente et un décembre de l’année suivante si la société commence ses activités au-delà des six premiers mois de l’année en cours.'));
  /* Article 7 : apports */
  ap(ART(7,'APPORTS'));
  ap({k:'sub',text:R[rn++]+' – Apports en numéraire'},P('Lors de la constitution, les soussignés ont fait apport à la société, à savoir :'));
  const nrows=V._numIdx.map(i=>[ASSO(i),'{{a'+i+'_num_chiffres}} F CFA']);
  nrows.push(['**Total des apports en numéraire :** {{num_tot_lettres}}, ci {{num_tot}} F CFA','**{{num_tot}} F CFA**']);
  ap({k:'table',cols:[62,38],al:['left','right'],head:['IDENTITÉ DES APPORTEURS','MONTANT DE L’APPORT EN NUMÉRAIRE'],rows:nrows});
  ap(P('Les apports en numéraire de {{num_tot}} F CFA ({{num_tot_lettres}}) correspondent à '+(T.ok&&T.numTot?fmt(T.numTot/T.nom):'{{parts}}')+' parts sociales de {{nominal_chiffres}} F CFA chacune, souscrites et libérées {{liberation_txt}} par les associés.'));
  if(moitie) ap(P('La libération de la seconde moitié par les associés ayant effectué une libération partielle des parts sociales devra intervenir, à la demande du Gérant, en une ou plusieurs fois dans un délai de deux années à compter de l’immatriculation de la société au Registre du Commerce et du Crédit Mobilier.'));
  ap(P('La somme correspondante a été déposée pour le compte de la société et conformément à la loi, dans un compte ouvert à {{banque}}.'));
  ap({k:'sub',text:R[rn++]+' – Apports en nature'});
  V._natIdx.forEach(i=>{
    ap(P('{{a'+i+'_civ}} {{a'+i+'_prenom}} {{a'+i+'_nom}}, en s’obligeant à toutes les garanties ordinaires et de droit, fait apport à la société de : {{a'+i+'_nat_desc}}'));
  });
  if(S.eval_mode==='ordonnance') ap(P('Il a été procédé à l’évaluation de chacun des apports en nature ci-dessus au vu du rapport annexé aux présents statuts, établi par {{commissaire}}, commissaire aux apports désigné par ordonnance du président du tribunal chargé des affaires commerciales de {{ord_ville}}, en date du {{ord_date_longue}}, à la requête de {{ord_requerant}}.'));
  else if(S.eval_mode==='dispense') ap(P('Aucun des apports en nature n’ayant une valeur supérieure à 5 000 000 F CFA et la valeur totale desdits apports n’excédant pas 5 000 000 F CFA, les associés, à l’unanimité, ont décidé de ne pas recourir à un commissaire aux apports et ont procédé eux-mêmes à l’évaluation.'));
  else ap(P('Il a été procédé à l’évaluation de chacun des apports en nature ci-dessus au vu du rapport annexé aux présents statuts, établi par {{commissaire}}, commissaire aux apports désigné à l’unanimité des futurs associés.'));
  V._natIdx.forEach(i=>{
    ap(P('En rémunération de son apport, évalué à {{a'+i+'_nat_val_chiffres}} F CFA, {{a'+i+'_civ}} {{a'+i+'_prenom}} {{a'+i+'_nom}} se voit attribuer {{a'+i+'_vp}} parts sociales.'));
  });
  if(ind){
    ap({k:'sub',text:R[rn++]+' – Apports en industrie'});
    V._indIdx.forEach(i=>{
      ap(P('{{a'+i+'_civ}} {{a'+i+'_prenom}} {{a'+i+'_nom}}, en s’obligeant à rendre à la société la contribution promise et à lui devoir compte de tous gains qu’{{a'+i+'_il}} aurait réalisés par l’activité faisant l’objet de son apport, fait apport à la société de ses connaissances techniques, professionnelles ou services consistant à :'));
      const cnt=(V._indLines&&V._indLines[i])||1;
      for(let k=0;k<cnt;k++) ap(L('{{a'+i+'_ind_l'+k+'}}'));

    });

       ['Apports en nature','{{nat_tot}} F CFA'],
       ['**Total des apports**','**{{tot_chiffres}} F CFA**']]});
  /* Article 8 : capital */
  ap(ART(8,'CAPITAL SOCIAL'),
     P('Le capital social est fixé à la somme de {{cap_chiffres}} F CFA, divisé en {{parts}} parts sociales de {{nominal_chiffres}} F CFA chacune, entièrement souscrites et libérées {{liberation_txt8}}, numérotées de 1 à {{parts}}, attribuées aux associés, à savoir :'));
  const crows=[];
  V._numIdx.forEach(i=>crows.push(['À '+ASSO(i)+', {{a'+i+'_np}} parts sociales numérotées de {{a'+i+'_nd}} à {{a'+i+'_nf}} inclus, en rémunération de son apport en numéraire ci-dessus','**{{a'+i+'_np}} PARTS**']));
  V._natIdx.forEach(i=>crows.push(['À '+ASSO(i)+', {{a'+i+'_vp}} parts sociales numérotées de {{a'+i+'_vd}} à {{a'+i+'_vf}} inclus, en rémunération de son apport en nature ci-dessus','**{{a'+i+'_vp}} PARTS**']));
  crows.push(['**TOTAL ÉGAL** au nombre de parts composant le capital social, soit {{parts}} parts sociales, ci-contre','**{{parts}} PARTS**']);
  ap({k:'table',cols:[72,28],al:['left','right'],head:['IDENTITÉ DES ASSOCIÉS','CONCURRENCE DES PARTS'],rows:crows});
  M2_ART_A.forEach(b=>B.push(b));
  /* Article 15 : gérance */
  ap(ART(15,'GÉRANCE'));
  ap(P('La société est gérée par une ou plusieurs personnes physiques, choisies parmi les associés ou en dehors d’eux. Elles sont nommées pour une durée de {{duree_gerant_txt}} et sont toujours rééligibles. La nomination des gérants au cours de la vie sociale est décidée à la majorité {{maj_txt}}.'));
  for(let j=0;j<V._ng;j++) ap(P('Est nommé gérant de la société : {{g'+j+'_civ}} {{g'+j+'_prenom}} {{g'+j+'_nom}}, demeurant à {{g'+j+'_adresse}}, qui accepte.'));
  ap(P('Les gérants reçoivent, à titre de rémunération de leurs fonctions et en compensation de la responsabilité attachée à la gestion de la société, un traitement dont le montant et les modalités de paiement sont déterminés par décision collective ordinaire des associés. Ce traitement peut être fixe ou proportionnel ou à la fois fixe et proportionnel selon des modalités arrêtées par les associés. Il peut comprendre, également, des avantages en nature et, éventuellement, être augmenté de gratifications exceptionnelles en cours ou en fin d’exercice social. Chaque gérant a droit au remboursement, sur justification, de ses frais de représentation et de déplacement.'),
     P('Les sommes versées aux gérants à titre de rémunération ou en remboursement de frais sont inscrites en dépenses d’exploitation. Les gérants sont soumis aux obligations fixées par la loi et les règlements et notamment à l’établissement des comptes annuels et du rapport de gestion.'),
     P('Les gérants peuvent démissionner de leur mandat, mais seulement en prévenant chacun des associés au moins {{preavis_txt}} à l’avance, par lettre recommandée avec demande d’avis de réception ou lettre au porteur contre récépissé.'),
     P('Les gérants sont révocables par décision des associés représentant plus de la moitié des parts sociales.'),
     P('La rémunération des gérants est fixée par la décision qui les nomme.'));
  ap(ART(16,'POUVOIRS DU GÉRANT'),P('Dans les rapports entre associés, le gérant peut faire tous les actes de gestion dans l’intérêt de la société.'));
  if(S.limiter==='oui') ap(P('Cependant, il ne peut, sans y être autorisé par une décision collective ordinaire des associés : {{limitations}}'));
  ap(P('Dans les rapports avec les tiers, le gérant est investi des pouvoirs les plus étendus pour agir en toutes circonstances, au nom de la société, sous réserve des pouvoirs expressément attribués aux associés par la loi.'),
     P('La société est engagée, même par les actes du gérant qui ne relèvent pas de l’objet social, à moins qu’elle ne prouve que le tiers savait que l’acte dépassait cet objet ou qu’il ne pouvait l’ignorer compte tenu des circonstances, étant exclu que la seule publication des statuts suffise à constituer cette preuve.'));
  M2_ART_B.forEach(b=>B.push(b));
  /* Articles 27 à 31 */
  ap(ART(27,'CONTESTATIONS ENTRE ASSOCIÉS OU ENTRE UN OU PLUSIEURS ASSOCIÉS ET LA SOCIÉTÉ'));
  if(S.contest==='arbitrage') ap(P('Les contestations relatives aux affaires de la société, survenant pendant la durée de la société ou au cours de sa liquidation, entre les associés ou entre un ou plusieurs associés et la société, sont soumises à l’arbitrage conformément aux dispositions de l’Acte Uniforme de l’OHADA s’y rapportant.'));
  else ap(P('Les contestations relatives aux affaires de la société survenant pendant la vie de la société ou au cours de sa liquidation, entre les associés ou entre un ou plusieurs associés et la société, sont soumises au tribunal chargé des affaires commerciales.'));
  ap(ART(28,'ENGAGEMENTS POUR LE COMPTE DE LA SOCIÉTÉ'),
     P('Un état des actes accomplis par les fondateurs pour le compte de la société en formation, avec indication de l’engagement qui en résulterait, sera présenté à la société qui s’engage à les reprendre.'));
  if(String(S.eng_mandataire||'').trim()||String(S.eng_texte||'').trim()) ap(P('En outre, les soussignés donnent mandat à {{eng_mandataire}} à l’effet de prendre les engagements suivants au nom et pour le compte de la société : {{eng_texte}}'));
  ap(ART(29,'FRAIS'),P('Les frais, droits et honoraires des présents statuts sont à la charge de la société.'),
     ART(30,'ÉLECTION DE DOMICILE'),P('Pour l’exécution des présentes et de leurs suites, les parties déclarent faire élection de domicile au siège social.'),
     ART(31,'POUVOIRS'),
     P('Les associés donnent tous pouvoirs à {{m_civ_long}} {{m_nom_complet}}, {{m_prof}}, titulaire de la pièce d’identité : {{m_pc}}, à l’effet de procéder à l’enregistrement des présents statuts, d’accomplir les formalités d’immatriculation au Registre du Commerce et du Crédit Mobilier, et, pour les besoins de ces formalités, de signer tout acte et d’en donner bonne et valable décharge.'),
     {k:'sp',kn:true},
     P('Fait à {{lieu}}, le {{date_longue}}',{kn:true}),
     P('EN {{nb_ex_lettres_maj}} ({{nb_ex_txt}}) EXEMPLAIRES ORIGINAUX',{kn:true}),
     {k:'sp',kn:true},P('**Les associés**',{kn:true}));
  const sg=[];for(let i=0;i<n;i++) sg.push('**'+ASSO(i)+'**');
  ap({k:'sigs',items:sg});
  return B;
}

function loadDraftO(id){
  try{const o=JSON.parse(localStorage.getItem('juriskpro:'+id+':v1')||'null');return o&&o.v?o:null;}catch(e){return null;}
}
function m3Sources(){
  const out=[];
  [['sarl-pluripersonnelle-mixte','Statuts de SARL pluripersonnelle',S=>!!(S.denomination||S.a0_prenom||S.a0_nom)],
   ['sarl-unipersonnelle-numeraire','Statuts de SARL unipersonnelle',S=>!!(S.denomination||S.prenom||S.nom||S.capital)]].forEach(x=>{
    const o=loadDraftO(x[0]);
    if(o&&x[2](o.v)) out.push({id:x[0],titre:x[1],S:o.v,t:o.t||0});
  });
  out.sort((a,b)=>b.t-a.t);
  return out;
}
function m3Import(){
  const src=m3Sources()[0];
  if(!src) return null;
  const S=src.S,P={},half=S.liberation==='moitie';
  ['denomination','sigle','objet','siege','banque','lieu'].forEach(k=>{P[k]=S[k]||'';});
  P.date_statuts=S.date||'';
  if(src.id==='sarl-pluripersonnelle-mixte'){
    const T=m2Totals(S);
    P.nb_assoc=String(T.n);P.nominal=S.nominal||'';
    for(let i=0;i<T.n;i++){
      ['civilite','prenom','nom','adresse'].forEach(k=>{P['a'+i+'_'+k]=S['a'+i+'_'+k]||(k==='civilite'?'M.':'');});
      const parts=T.nom?Math.round((T.num[i]+T.nat[i])/T.nom):0;
      P['a'+i+'_parts']=parts?String(parts):'';
      P['a'+i+'_verse']=String(half?Math.ceil(T.num[i]/2):T.num[i]);
    }
  }else{
    const cap=+S.capital||0,nom=+S.nominal||0;
    P.nb_assoc='1';P.nominal=S.nominal||'';
    P.a0_civilite=S.civilite||'M.';P.a0_prenom=S.prenom||'';P.a0_nom=S.nom||'';P.a0_adresse=S.adresse||'';
    P.a0_parts=(cap&&nom)?String(Math.round(cap/nom)):'';
    P.a0_verse=String(half?Math.ceil(cap/2):cap);
  }
  return {patch:P,titre:src.titre};
}

function m3Totals(S){
  const g=k=>String(S[k]==null?'':S[k]).trim();
  const n=clamp(parseInt(g('nb_assoc'),10)||1,1,10);
  const nom=+g('nominal')||0,parts=[],verse=[];let pt=0,vt=0,vAny=false;
  for(let i=0;i<n;i++){
    const a=+g('a'+i+'_parts')||0,b=+g('a'+i+'_verse')||0;
    parts.push(a);verse.push(b);pt+=a;vt+=b;
    if(g('a'+i+'_verse')!=='') vAny=true;
  }
  return {n:n,nom:nom,parts:parts,verse:verse,pt:pt,vt:vt,vAny:vAny,cap:pt*nom};
}

function m3Compute(S){
  const V=newV(),g=k=>String(S[k]==null?'':S[k]).trim(),gn=k=>g(k).replace(/\s*\n+\s*/g,' ');
  const T=m3Totals(S),n=T.n,pr=(k,val,src)=>{V[k]=val;if(src)V._src[k]=src;};
  for(let i=0;i<n;i++) addPerson(V,S,'a',i);
  ['denomination','sigle','objet','siege','banque','lieu'].forEach(k=>{V[k]=gn(k);});
  V.sigle_txt=g('sigle')?', en abrégé « '+g('sigle')+' »':'';V._src.sigle_txt='sigle';
  V.annee_lettres=anneeLettres(g('date'));V._src.annee_lettres='date';
  V.date_longue=dateFr(g('date'));V._src.date_longue='date';
  V.date_statuts_longue=dateFr(g('date_statuts'));V._src.date_statuts_longue='date_statuts';
  V.enreg_txt=g('date_enreg')?', enregistré le '+dateFr(g('date_enreg')):', enregistré le ………………';V._src.enreg_txt='date_enreg';V._nohl.add('enreg_txt');
  /* accords singulier / pluriel */
  const sing=n===1,fem=g('a0_civilite')==='Mme';
  const gram=(k,v)=>{V[k]=v;V._nohl.add(k);};
  gram('sous',sing?(fem?'La soussignée':'Le soussigné'):'Les soussignés');
  gram('sous_min',sing?(fem?'la soussignée':'le soussigné'):'les soussignés');
  gram('etabli',sing?'a établi':'ont établi');
  gram('entre',sing?(fem?'elle':'lui'):'eux');
  gram('decl',sing?'déclare':'déclarent');
  gram('dresse',sing?(fem?'elle a dressé':'il a dressé'):'ils ont dressé');
  gram('titre_sig',sing?'L’associé unique':'Les associés');
  /* parts, numérotation, montants */
  let cur=1;
  for(let i=0;i<n;i++){
    const p='a'+i+'_',a=T.parts[i];
    pr(p+'parts',a?fmt(a):'');
    pr(p+'nd',a?String(cur):'',p+'parts');pr(p+'nf',a?String(cur+a-1):'',p+'parts');
    if(a) cur+=a;
    pr(p+'souscrit',(a&&T.nom)?fmt(a*T.nom):'',a?'nominal':p+'parts');
    const raw=g(p+'verse');
    pr(p+'verse_txt',raw===''?'':(T.verse[i]>0?fmt(T.verse[i]):'—'),p+'verse');
  }
  pr('nominal_chiffres',T.nom?fmt(T.nom):'','nominal');
  pr('parts_tot',T.pt?fmt(T.pt):'','a0_parts');
  pr('capital',(T.pt&&T.nom)?fmt(T.cap):'',T.pt?'nominal':'a0_parts');
  pr('verse_tot',T.vAny?fmt(T.vt):'','a0_verse');
  const nbx=+g('nb_ex')||(n+2);
  pr('nb_ex_txt',String(nbx),'nb_ex');pr('nb_ex_lettres_maj',lettres(nbx).toUpperCase(),'nb_ex');
  return V;
}
