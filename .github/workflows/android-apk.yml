name: Build JuriskPro Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "core.js"
      - "catalogue.js"
      - "models/**"
      - "styles.css"
      - "sw.js"
      - "manifest.webmanifest"
      - "vendor/**"
      - "auth-gate.js"
      - "supabase-config.js"
      - "politique-confidentialite.html"
      - "icons/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

env:
  CI: true
  # Vrai seulement si la clé de signature est enregistrée dans les secrets GitHub (voir SIGNATURE-APK.md)
  HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Create Android project
        run: npx cap add android

      - name: Apply JuriskPro Android theme
        run: node scripts/patch-android.cjs

      - name: Create splash screen image
        run: node scripts/make-splash.cjs

      - name: Generate Android icons and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0B3D2E' --iconBackgroundColorDark '#0B3D2E' --splashBackgroundColor '#0D1411' --splashBackgroundColorDark '#0D1411'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JuriskPro-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build release APK (optimisé)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Signer l'APK release
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$SRC" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out JuriskPro-release.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose JuriskPro-release.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK signé
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: JuriskPro-release-APK-signe
          path: JuriskPro-release.apk
          if-no-files-found: error
          retention-days: 90
