name: Build JuriskPro Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "auth-gate.js"
      - "supabase-config.js"
      - "politique-confidentialite.html"
      - "icons/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

env:
  CI: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Create Android project
        run: npx cap add android

      - name: Apply JuriskPro Android theme
        run: node scripts/patch-android.cjs

      - name: Generate Android icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0B3D2E' --iconBackgroundColorDark '#0B3D2E'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JuriskPro-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
